name: one-shot Android DOM delta host

on:
  push:
    branches:
      - agent/runtime-efficiency

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-efficiency
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Add delta host API
        shell: python
        run: |
          from pathlib import Path

          client = Path('cli/src/android_dom_browser.rs')
          text = client.read_text()
          marker = '''    pub fn snapshot(&mut self) -> Result<Value> {
                  self.request_readonly("GET", "/v1/snapshot", None)
              }
          '''
          addition = marker + '''
              pub fn snapshot_delta(&mut self, previous_state_hash: &str) -> Result<Value> {
                  if previous_state_hash.is_empty() || previous_state_hash.len() > 256 {
                      return Err(AndroidError::InvalidInput(
                          "snapshot delta requires a bounded previousStateHash".to_string(),
                      ));
                  }
                  self.request_readonly(
                      "POST",
                      "/v1/snapshot-delta",
                      Some(json!({"previousStateHash": previous_state_hash})),
                  )
              }
          '''
          if 'pub fn snapshot_delta' not in text:
              if marker not in text:
                  raise SystemExit('client snapshot anchor missing')
              text = text.replace(marker, addition, 1)
          client.write_text(text)

          binary = Path('cli/src/bin/tempera-android-dom-browser.rs')
          text = binary.read_text()
          if 'SnapshotDelta' not in text:
              text = text.replace(
                  '    Snapshot,\n',
                  '''    Snapshot,
              SnapshotDelta {
                  #[arg(long)]
                  previous_state_hash: String,
              },
          ''',
                  1,
              )
              text = text.replace(
                  '        Commands::Snapshot => client.snapshot(),\n',
                  '''        Commands::Snapshot => client.snapshot(),
              Commands::SnapshotDelta { previous_state_hash } => {
                  client.snapshot_delta(&previous_state_hash)
              }
          ''',
                  1,
              )
              text = text.replace(
                  '        "snapshot" => client.snapshot(),\n',
                  '''        "snapshot" => client.snapshot(),
              "snapshotDelta" => {
                  client.snapshot_delta(required_string(object, "previousStateHash")?)
              }
          ''',
                  1,
              )
          binary.write_text(text)
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo build --workspace --release
      - name: Commit validated delta host
        shell: bash
        run: |
          set -euo pipefail
          git add cli/src/android_dom_browser.rs cli/src/bin/tempera-android-dom-browser.rs
          if git diff --cached --quiet; then
            echo 'Already wired'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: wire Android DOM snapshot deltas'
          git push origin HEAD:agent/runtime-efficiency
