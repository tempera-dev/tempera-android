name: one-shot Android DOM browser host

on:
  push:
    branches:
      - agent/runtime-efficiency

permissions:
  contents: write

jobs:
  validate-host:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-efficiency
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply stable-Rust transport fixes
        shell: python
        run: |
          from pathlib import Path
          path = Path('cli/src/android_dom_browser.rs')
          text = path.read_text()
          text = text.replace('        stream.set_keepalive(true)?;\n', '', 1)
          old = '''fn read_bounded_header_line(reader: &mut BufReader<TcpStream>) -> Result<String> {
              let mut line = Vec::new();
              let bytes = reader
                  .by_ref()
                  .take((MAX_HEADER_LINE + 1) as u64)
                  .read_until(b'\\n', &mut line)?;
              if bytes == 0 {
                  return Err(AndroidError::Backend(
                      "Android browser control connection closed".to_string(),
                  ));
              }
              if line.len() > MAX_HEADER_LINE {
                  return Err(AndroidError::Backend(
                      "Android browser HTTP header exceeds limit".to_string(),
                  ));
              }
              while matches!(line.last(), Some(b'\\r' | b'\\n')) {
                  line.pop();
              }
              String::from_utf8(line)
                  .map_err(|_| AndroidError::Backend("Android browser HTTP header is not UTF-8".to_string()))
          }'''
          new = '''fn read_bounded_header_line(reader: &mut BufReader<TcpStream>) -> Result<String> {
              let mut line = Vec::new();
              loop {
                  let available = reader.fill_buf()?;
                  if available.is_empty() {
                      return Err(AndroidError::Backend(
                          "Android browser control connection closed".to_string(),
                      ));
                  }
                  let take = available
                      .iter()
                      .position(|byte| *byte == b'\\n')
                      .map_or(available.len(), |index| index + 1);
                  if line.len().saturating_add(take) > MAX_HEADER_LINE {
                      return Err(AndroidError::Backend(
                          "Android browser HTTP header exceeds limit".to_string(),
                      ));
                  }
                  line.extend_from_slice(&available[..take]);
                  reader.consume(take);
                  if line.last() == Some(&b'\\n') {
                      break;
                  }
              }
              while matches!(line.last(), Some(b'\\r' | b'\\n')) {
                  line.pop();
              }
              String::from_utf8(line).map_err(|_| {
                  AndroidError::Backend("Android browser HTTP header is not UTF-8".to_string())
              })
          }'''
          if old not in text:
              raise SystemExit('bounded header helper anchor not found')
          path.write_text(text.replace(old, new, 1))
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --workspace --release
      - name: Commit validated host runtime
        shell: bash
        run: |
          set -euo pipefail
          git add cli/src/android_dom_browser.rs cli/src/bin/tempera-android-dom-browser.rs cli/src/lib.rs
          if git diff --cached --quiet; then
            echo 'No host changes after validation'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: validate persistent Android DOM browser host'
          git push origin HEAD:agent/runtime-efficiency
