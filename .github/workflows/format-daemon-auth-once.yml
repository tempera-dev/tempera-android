name: Format daemon authority once

on:
  push:
    branches:
      - agent/tempera-use-authenticated-daemon
    paths:
      - .github/workflows/format-daemon-auth-once.yml

permissions:
  contents: write

concurrency:
  group: format-daemon-auth-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tempera-use-authenticated-daemon
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt
      - name: Apply canonical rustfmt
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          git diff --name-only | sort > /tmp/actual
          printf '%s\n' cli/src/daemon_auth.rs > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - name: Commit formatted product tree and remove formatter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/format-daemon-auth-once.yml
          git add cli/src/daemon_auth.rs
          git diff --cached --check
          git commit -m 'style: canonically format daemon authority'
          git push origin HEAD:agent/tempera-use-authenticated-daemon
