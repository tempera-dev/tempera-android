name: one-shot persistent Android bridge

on:
  push:
    branches:
      - agent/runtime-efficiency
  pull_request:
    branches:
      - agent/android-computer-use
    paths:
      - "cli/src/bridge.rs"
      - "docs/PERSISTENT_BRIDGE_VALIDATION.md"
      - ".github/workflows/one-shot-persistent-bridge.yml"

permissions:
  contents: write

jobs:
  persist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-efficiency
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Add persistent bridge channel
        shell: python
        run: |
          from pathlib import Path
          path = Path('cli/src/bridge.rs')
          text = path.read_text()
          if 'connection: Option<BufReader<TcpStream>>' not in text:
              old = '''    client_id: String,
                  server_epoch: Option<String>,
                  adb: AdbBackend,
              }'''
              new = '''    client_id: String,
                  server_epoch: Option<String>,
                  adb: AdbBackend,
                  connection: Option<BufReader<TcpStream>>,
                  sequence: u64,
              }'''
              if old not in text:
                  raise SystemExit('BridgeClient field anchor missing')
              text = text.replace(old, new, 1)
              old = '''            server_epoch: None,
                      adb,
                  };'''
              new = '''            server_epoch: None,
                      adb,
                      connection: None,
                      sequence: 0,
                  };'''
              if old not in text:
                  raise SystemExit('BridgeClient constructor anchor missing')
              text = text.replace(old, new, 1)

              start = text.index('    fn request(&mut self, operation: &str, payload: Value, requires_epoch: bool) -> Result<Value> {')
              end = text.index('\n    }\n}\n\n/// Translate a public action', start) + len('\n    }')
              replacement = r'''    fn request(&mut self, operation: &str, payload: Value, requires_epoch: bool) -> Result<Value> {
              self.sequence = self.sequence.wrapping_add(1);
              let request_id = format!("{}-{}", self.client_id, self.sequence);
              let request = self.build_request(operation, payload, requires_epoch, &request_id)?;
              match self.request_once(&request) {
                  Ok(result) => Ok(result),
                  Err(first) => {
                      // Bridge protocol v3 caches responses by (client_id, id).
                      // Retrying this exact serialized request is therefore
                      // at-most-once even when the first response was lost.
                      self.connection = None;
                      self.request_once(&request).map_err(|second| {
                          AndroidError::Backend(format!(
                              "Bridge request failed after one at-most-once reconnect: first={first}; second={second}"
                          ))
                      })
                  }
              }
          }

          fn build_request(
              &self,
              operation: &str,
              payload: Value,
              requires_epoch: bool,
              request_id: &str,
          ) -> Result<Value> {
              let mut request = json!({
                  "id": request_id,
                  "client_id": self.client_id,
                  "token": self.token,
                  "op": operation,
              });
              if requires_epoch {
                  let epoch = self.server_epoch.as_deref().ok_or_else(|| {
                      AndroidError::Backend("Bridge health was not completed".to_string())
                  })?;
                  request["server_epoch"] = Value::String(epoch.to_string());
              }
              if let Some(values) = payload.as_object() {
                  for (key, value) in values {
                      request[key] = value.clone();
                  }
              }
              Ok(request)
          }

          fn request_once(&mut self, request: &Value) -> Result<Value> {
              self.ensure_connection()?;
              let encoded = serde_json::to_vec(request)?;
              if encoded.len() > 1_000_000 {
                  return Err(AndroidError::InvalidInput(
                      "Bridge request exceeds device protocol limit".to_string(),
                  ));
              }
              let connection = self.connection.as_mut().expect("bridge connection established");
              connection.get_mut().write_all(&encoded)?;
              connection.get_mut().write_all(b"\n")?;
              connection.get_mut().flush()?;
              let mut line = String::new();
              let bytes = connection.read_line(&mut line)?;
              if bytes == 0 {
                  return Err(AndroidError::Backend(
                      "Bridge closed the persistent connection before responding".to_string(),
                  ));
              }
              if line.len() > 4 * 1024 * 1024 {
                  return Err(AndroidError::Backend(
                      "Bridge response exceeds 4 MiB host limit".to_string(),
                  ));
              }
              let response: Value = serde_json::from_str(&line)?;
              if response.get("ok").and_then(Value::as_bool) != Some(true) {
                  return Err(AndroidError::Backend(
                      response
                          .get("error")
                          .and_then(Value::as_str)
                          .unwrap_or("Bridge request failed")
                          .to_string(),
                  ));
              }
              response
                  .get("result")
                  .cloned()
                  .ok_or_else(|| AndroidError::Backend("Bridge response omitted result".to_string()))
          }

          fn ensure_connection(&mut self) -> Result<()> {
              if self.connection.is_some() {
                  return Ok(());
              }
              let address = format!("127.0.0.1:{}", self.host_port)
                  .parse()
                  .map_err(|_| AndroidError::Backend("Invalid bridge port".to_string()))?;
              let stream = TcpStream::connect_timeout(&address, Duration::from_millis(900))?;
              stream.set_nodelay(true)?;
              stream.set_read_timeout(Some(Duration::from_secs(8)))?;
              stream.set_write_timeout(Some(Duration::from_secs(5)))?;
              self.connection = Some(BufReader::new(stream));
              Ok(())
          }'''
              text = text[:start] + replacement + text[end:]
              path.write_text(text)
      - name: Format and validate
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo build --workspace --release
      - name: Commit validated persistent bridge
        shell: bash
        run: |
          set -euo pipefail
          git add cli/src/bridge.rs
          if git diff --cached --quiet; then
            echo 'Bridge already persistent'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: keep Android bridge transport persistent'
          git push origin HEAD:agent/runtime-efficiency
