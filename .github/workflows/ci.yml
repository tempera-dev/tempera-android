name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace

  companion:
    name: signed companion APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android compile surface
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build and verify bridge APK
        run: bash scripts/build-companion.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tempera-android-bridge
          path: companion/build/tempera-android-bridge.apk

  emulator-adb-smoke:
    name: real Linux emulator ADB smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", MODE="0666", GROUP="kvm", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          # This is intentionally a folded scalar: android-emulator-runner
          # invokes each newline as a separate shell, so its shared ADB setup
          # and the assertion must stay in one process.
          script: >
            set -e; adb_path="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/platform-tools/adb";
            export TEMPERA_ANDROID_ADB="$adb_path"; "$TEMPERA_ANDROID_ADB" -s emulator-5554 wait-for-device;
            while [ "$("$TEMPERA_ANDROID_ADB" -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do sleep 1; done;
            response="$(cargo run --release -p tempera-android -- --serial emulator-5554 --transport adb --json snapshot)";
            printf '%s\n' "$response"; printf '%s\n' "$response" | jq -e '.ok == true' >/dev/null

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
