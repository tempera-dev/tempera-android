name: one-shot Android DOM browser cold start

on:
  push:
    branches:
      - agent/runtime-efficiency

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-efficiency
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Add packaged APK install and bounded token readiness
        shell: python
        run: |
          from pathlib import Path
          path = Path('cli/src/android_dom_browser.rs')
          text = path.read_text()
          if 'ensure_browser_package' not in text:
              text = text.replace(
                  'use std::io::{BufRead, BufReader, Read, Write};\n',
                  'use std::env;\nuse std::io::{BufRead, BufReader, Read, Write};\nuse std::path::Path;\nuse std::thread;\n',
                  1,
              )
              old = '''        let adb = AdbBackend::new(serial)?;
                  adb.ensure_ready()?;
                  adb.shell(&["am", "start", "-n", &format!("{PACKAGE}/{ACTIVITY}")])?;
                  let token = read_token(&adb)?;'''
              new = '''        let adb = AdbBackend::new(serial)?;
                  adb.ensure_ready()?;
                  ensure_browser_package(&adb)?;
                  adb.shell(&["am", "start", "-n", &format!("{PACKAGE}/{ACTIVITY}")])?;
                  let token = wait_for_token(&adb)?;'''
              if old not in text:
                  raise SystemExit('connect anchor missing')
              text = text.replace(old, new, 1)
              anchor = 'fn read_token(adb: &AdbBackend) -> Result<String> {'
              if anchor not in text:
                  raise SystemExit('token helper anchor missing')
              helpers = '''fn ensure_browser_package(adb: &AdbBackend) -> Result<()> {
              if adb.app_list(true)?.iter().any(|package| package == PACKAGE) {
                  return Ok(());
              }
              let apk = env::var("TEMPERA_ANDROID_BROWSER_APK").map_err(|_| {
                  AndroidError::Backend(
                      "Dedicated Android browser is not installed and TEMPERA_ANDROID_BROWSER_APK is not set"
                          .to_string(),
                  )
              })?;
              let path = Path::new(&apk);
              if !path.is_file() || path.extension().and_then(|value| value.to_str()) != Some("apk") {
                  return Err(AndroidError::InvalidInput(
                      "TEMPERA_ANDROID_BROWSER_APK must point to an existing .apk file".to_string(),
                  ));
              }
              adb.app_install(&[apk])
          }

          fn wait_for_token(adb: &AdbBackend) -> Result<String> {
              let mut last_error = None;
              for _ in 0..30 {
                  match read_token(adb) {
                      Ok(token) => return Ok(token),
                      Err(error) => last_error = Some(error),
                  }
                  thread::sleep(Duration::from_millis(100));
              }
              Err(last_error.unwrap_or_else(|| {
                  AndroidError::Backend("Dedicated Android browser did not become ready".to_string())
              }))
          }

          '''
              text = text.replace(anchor, helpers + anchor, 1)
              path.write_text(text)
      - name: Format and validate
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo build --workspace --release
      - name: Commit validated cold-start path
        shell: bash
        run: |
          set -euo pipefail
          git add cli/src/android_dom_browser.rs
          if git diff --cached --quiet; then
            echo 'Cold-start path already hardened'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: harden dedicated browser cold start'
          git push origin HEAD:agent/runtime-efficiency
