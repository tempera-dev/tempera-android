name: one-shot Android browser packaging pass

on:
  push:
    branches:
      - agent/runtime-efficiency

permissions:
  contents: write

jobs:
  package-browser:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-efficiency
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compact and package the Android browser
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'cli/src/android_browser.rs',
              '''pub struct BrowserSnapshotV1 {
                  pub schema_version: String,
                  pub package: String,
                  pub url_hint: Option<String>,
                  pub title_hint: Option<String>,
                  pub revision: u64,
                  pub state_hash: String,
                  pub captured_at_ms: u128,
                  pub screen: [u32; 2],
                  pub nodes: Vec<NodeV1>,
                  pub android: SnapshotV1,
              }''',
              '''pub struct BrowserSnapshotV1 {
                  pub schema_version: String,
                  pub session_id: String,
                  pub serial: String,
                  pub target_kind: String,
                  pub package: String,
                  pub activity: String,
                  pub url_hint: Option<String>,
                  pub title_hint: Option<String>,
                  pub revision: u64,
                  pub state_hash: String,
                  pub captured_at_ms: u128,
                  pub screen: [u32; 2],
                  pub nodes: Vec<NodeV1>,
              }''',
          )
          replace_once(
              'cli/src/android_browser.rs',
              '''    let serial = resolve_serial(request.serial.as_deref())?;
                  let backend = AdbBackend::new(serial.clone())?;
                  backend.ensure_ready()?;
                  let started = Instant::now();''',
              '''    let serial = resolve_serial(request.serial.as_deref())?;
                  let mut pinned_request = request.clone();
                  pinned_request.serial = Some(serial.clone());
                  let backend = AdbBackend::new(serial.clone())?;
                  backend.ensure_ready()?;
                  let started = Instant::now();''',
          )
          replace_once(
              'cli/src/android_browser.rs',
              '        match snapshot(request) {',
              '        match snapshot(&pinned_request) {',
          )
          replace_once(
              'cli/src/android_browser.rs',
              '''    Ok(BrowserSnapshotV1 {
                  schema_version: ANDROID_BROWSER_SCHEMA_V1.to_string(),
                  package: snapshot.package.clone(),
                  url_hint,
                  title_hint,
                  revision: snapshot.revision,
                  state_hash: snapshot.state_hash.clone(),
                  captured_at_ms: snapshot.captured_at_ms,
                  screen: snapshot.screen,
                  nodes,
                  android: snapshot,
              })''',
              '''    Ok(BrowserSnapshotV1 {
                  schema_version: ANDROID_BROWSER_SCHEMA_V1.to_string(),
                  session_id: snapshot.session_id.clone(),
                  serial: snapshot.serial.clone(),
                  target_kind: snapshot.target_kind.clone(),
                  package: snapshot.package.clone(),
                  activity: snapshot.activity.clone(),
                  url_hint,
                  title_hint,
                  revision: snapshot.revision,
                  state_hash: snapshot.state_hash.clone(),
                  captured_at_ms: snapshot.captured_at_ms,
                  screen: snapshot.screen,
                  nodes,
              })''',
          )
          replace_once(
              'cli/src/android_browser.rs',
              '''    let p95_index = ((samples.len() - 1) * 95) / 100;
                  Ok(json!({''',
              '''    let p95_index = ((samples.len() - 1) * 95) / 100;
                  let semantic_payload_bytes = last
                      .as_ref()
                      .map(serde_json::to_vec)
                      .transpose()?
                      .map_or(0, |bytes| bytes.len());
                  Ok(json!({''',
          )
          replace_once(
              'cli/src/android_browser.rs',
              '''        "transport": request.transport,
                  "observation": {''',
              '''        "transport": request.transport,
                  "semanticPayloadBytes": semantic_payload_bytes,
                  "observation": {''',
          )
          replace_once(
              'cli/src/android_browser_fast.rs',
              '''    Ok(BrowserSnapshotV1 {
                  schema_version: ANDROID_BROWSER_SCHEMA_V1.to_string(),
                  package: android.package.clone(),
                  url_hint,
                  title_hint,
                  revision: android.revision,
                  state_hash: android.state_hash.clone(),
                  captured_at_ms: android.captured_at_ms,
                  screen: android.screen,
                  nodes,
                  android,
              })''',
              '''    Ok(BrowserSnapshotV1 {
                  schema_version: ANDROID_BROWSER_SCHEMA_V1.to_string(),
                  session_id: android.session_id.clone(),
                  serial: android.serial.clone(),
                  target_kind: android.target_kind.clone(),
                  package: android.package.clone(),
                  activity: android.activity.clone(),
                  url_hint,
                  title_hint,
                  revision: android.revision,
                  state_hash: android.state_hash.clone(),
                  captured_at_ms: android.captured_at_ms,
                  screen: android.screen,
                  nodes,
              })''',
          )

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['bin'] = {
              'tempera-android': 'bin/tempera-android.js',
              'tempera-android-browser': 'bin/tempera-android-browser.js',
          }
          package['scripts']['test'] = (
              'node --check bin/tempera-android.js && '
              'node --check bin/tempera-android-browser.js && '
              'node --test test/*.test.mjs'
          )
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          Path('bin/tempera-android-browser.js').write_text('''#!/usr/bin/env node
          import { spawnSync } from "node:child_process";
          import { existsSync } from "node:fs";
          import path from "node:path";
          import { fileURLToPath } from "node:url";

          const directory = path.dirname(fileURLToPath(import.meta.url));
          const executable = process.platform === "win32"
            ? "tempera-android-browser.exe"
            : "tempera-android-browser";
          const binary = path.join(directory, executable);
          if (!existsSync(binary)) {
            console.error(`Missing native Tempera Android browser binary: ${binary}`);
            process.exit(1);
          }
          const result = spawnSync(binary, process.argv.slice(2), { stdio: "inherit" });
          if (result.error) {
            console.error(result.error.message);
            process.exit(1);
          }
          process.exit(result.status ?? 1);
          ''')

          release = Path('.github/workflows/release-artifacts.yml')
          text = release.read_text()
          mappings = {
              '            binary: target/x86_64-unknown-linux-gnu/release/tempera-android\n':
                  '            binary: target/x86_64-unknown-linux-gnu/release/tempera-android\n            browser_binary: target/x86_64-unknown-linux-gnu/release/tempera-android-browser\n',
              '            binary: target/aarch64-unknown-linux-gnu/release/tempera-android\n':
                  '            binary: target/aarch64-unknown-linux-gnu/release/tempera-android\n            browser_binary: target/aarch64-unknown-linux-gnu/release/tempera-android-browser\n',
              '            binary: target/x86_64-apple-darwin/release/tempera-android\n':
                  '            binary: target/x86_64-apple-darwin/release/tempera-android\n            browser_binary: target/x86_64-apple-darwin/release/tempera-android-browser\n',
              '            binary: target/aarch64-apple-darwin/release/tempera-android\n':
                  '            binary: target/aarch64-apple-darwin/release/tempera-android\n            browser_binary: target/aarch64-apple-darwin/release/tempera-android-browser\n',
              '            binary: target/x86_64-pc-windows-gnu/release/tempera-android.exe\n':
                  '            binary: target/x86_64-pc-windows-gnu/release/tempera-android.exe\n            browser_binary: target/x86_64-pc-windows-gnu/release/tempera-android-browser.exe\n',
              '            binary: target/aarch64-pc-windows-msvc/release/tempera-android.exe\n':
                  '            binary: target/aarch64-pc-windows-msvc/release/tempera-android.exe\n            browser_binary: target/aarch64-pc-windows-msvc/release/tempera-android-browser.exe\n',
          }
          for old, new in mappings.items():
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected release matrix match count for {old!r}')
              text = text.replace(old, new, 1)
          old = '          path: ${{ matrix.binary }}\n'
          new = '          path: |\n            ${{ matrix.binary }}\n            ${{ matrix.browser_binary }}\n'
          if text.count(old) != 1:
              raise SystemExit('release artifact path anchor missing')
          text = text.replace(old, new, 1)
          copy_anchor = '''          cp artifacts/x86_64-pc-windows-gnu/tempera-android.exe package/bin/tempera-android.exe
                  cp artifacts/aarch64-pc-windows-msvc/tempera-android.exe package/bin/windows-arm64/tempera-android.exe
                  chmod +x package/bin/tempera-android
          '''
          copy_replacement = '''          cp artifacts/x86_64-pc-windows-gnu/tempera-android.exe package/bin/tempera-android.exe
                  cp artifacts/aarch64-pc-windows-msvc/tempera-android.exe package/bin/windows-arm64/tempera-android.exe
                  cp artifacts/${{ matrix.linux_target }}/tempera-android-browser package/bin/tempera-android-browser
                  cp artifacts/${{ matrix.macos_target }}/tempera-android-browser package/bin/${{ matrix.macos_dir }}/tempera-android-browser
                  cp artifacts/x86_64-pc-windows-gnu/tempera-android-browser.exe package/bin/tempera-android-browser.exe
                  cp artifacts/aarch64-pc-windows-msvc/tempera-android-browser.exe package/bin/windows-arm64/tempera-android-browser.exe
                  chmod +x package/bin/tempera-android package/bin/tempera-android-browser
          '''
          if text.count(copy_anchor) != 1:
              raise SystemExit('release copy anchor missing')
          text = text.replace(copy_anchor, copy_replacement, 1)
          text = text.replace(
              "          test -n \"$(tar -tf \"$TGZ\" | grep 'package/bin/tempera-android.js')\"\n",
              "          test -n \"$(tar -tf \"$TGZ\" | grep 'package/bin/tempera-android.js')\"\n          test -n \"$(tar -tf \"$TGZ\" | grep 'package/bin/tempera-android-browser.js')\"\n",
              1,
          )
          text = text.replace(
              '          ./package/bin/tempera-android --version\n',
              '          ./package/bin/tempera-android --version\n          ./package/bin/tempera-android-browser --version\n',
              1,
          )
          text = text.replace(
              '          ./package/bin/${{ matrix.macos_dir }}/tempera-android --version\n',
              '          ./package/bin/${{ matrix.macos_dir }}/tempera-android --version\n          ./package/bin/${{ matrix.macos_dir }}/tempera-android-browser --version\n',
              1,
          )
          text = text.replace(
              '          wine package/bin/tempera-android.exe --version\n',
              '          wine package/bin/tempera-android.exe --version\n          wine package/bin/tempera-android-browser.exe --version\n',
              1,
          )
          release.write_text(text)

          docs = Path('docs/ANDROID_BROWSER.md')
          docs_text = docs.read_text()
          docs_text = docs_text.replace(
              'A snapshot returns compact browser nodes plus the underlying Android snapshot, revision, and state hash.',
              'A snapshot returns one compact browser node set plus Android identity metadata, revision, and state hash. It deliberately does not duplicate the full Android node tree.',
          )
          docs.write_text(docs_text)
      - name: Format and validate package files
        run: |
          cargo fmt --manifest-path cli/Cargo.toml
          node --check bin/tempera-android-browser.js
          node --check bin/tempera-android.js
          python -m json.tool package.json >/dev/null
      - name: Commit browser packaging pass
        shell: bash
        run: |
          set -euo pipefail
          git add \
            cli/src/android_browser.rs \
            cli/src/android_browser_fast.rs \
            bin/tempera-android-browser.js \
            package.json \
            .github/workflows/release-artifacts.yml \
            docs/ANDROID_BROWSER.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf: compact and package Android browser runtime"
          git push origin HEAD:agent/runtime-efficiency
