name: one-shot Android browser Clippy repair

on:
  push:
    branches:
      - agent/runtime-efficiency

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-efficiency
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact lint repair
        shell: python
        run: |
          from pathlib import Path
          path = Path('cli/src/model_policy.rs')
          text = path.read_text()
          old = 'for target in [&self.fast, &self.reasoning].into_iter().flatten() {'
          new = 'for target in self.fast.iter().chain(self.reasoning.iter()) {'
          if old not in text:
              raise SystemExit('expected model-policy loop not found')
          path.write_text(text.replace(old, new, 1))
      - name: Format
        run: cargo fmt --manifest-path cli/Cargo.toml
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git add cli/src/model_policy.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: satisfy model policy Clippy contract"
          git push origin HEAD:agent/runtime-efficiency
